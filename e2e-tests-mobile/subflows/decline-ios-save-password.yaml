# Shared subflow, referenced by the flows in ../flows via `runFlow`. It deliberately lives outside
# flows/ so that `maestro test flows/` doesn't pick it up as a test of its own.
#
# After a successful sign up or log in, iOS pops its own "Would you like to save this password in
# your Keychain?" alert over the app, which blocks everything behind it. Decline it. This is a
# system alert rather than app UI, so there's nothing we can set on our side to stop it (the
# textContentType/autoComplete hack on the password inputs only stops iOS from covering the field
# while typing). Conditional, so it's a no-op when the alert doesn't appear.
appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: 'Save Password'
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible: 'Save Password'
    commands:
      - tapOn: 'Not Now'
