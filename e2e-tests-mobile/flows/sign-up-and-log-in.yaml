# Expo Go bundle id on iOS; for Android use 'host.exp.exponent' (see src/expoGoBundleIds.ts).
# Switch to our own bundle id when we move from Expo Go to a dev build.
appId: host.exp.Exponent
---
# Deliberately no `clearState`. It would wipe Expo Go's own storage too, which resets its
# first-launch onboarding, the location grant, and the Keychain prompt state — so every run would
# have to fight three iOS/Expo Go dialogs instead of none. We don't need it: signing up a freshly
# generated user replaces whatever session was left behind, and a landlord only ever sees their own
# spots. See the subflow calls below, which mop up those dialogs when they *do* appear (a
# first-ever run on a new simulator, or after someone resets Expo Go by hand).

# Open Expo Go with our dev-server URL, deep-linking straight to /signUp via the `--/<route>`
# syntax. Bypasses the log-in screen entirely so we don't have to tap a Pressable on the auth
# screen (which fires unreliably from Maestro on iOS Bridgeless mode).
- openLink: exp://127.0.0.1:9082/--/signUp

# Build a unique email so each run is self-isolating and doesn't pollute dev data. Avoid backtick
# template literals — Maestro's own `${...}` preprocessor walks them recursively and breaks the
# string. Plain string concatenation works fine in Maestro's GraalVM JS engine.
- evalScript: ${output.email = 'parker-mobile-e2e-' + Date.now() + '-' + Math.floor(Math.random() * 1e6) + '@example.com'}

# Expo Go covers our app with its own developer menu on the first launch after `clearState`
- runFlow: ../subflows/dismiss-expo-go-dev-menu.yaml
# iOS system alerts outlive `clearState`, so a previous run that failed part-way can leave one on
# screen, and a first-ever run hits Expo Go's onboarding. All conditional no-ops otherwise.
- runFlow: ../subflows/allow-ios-location.yaml
- runFlow: ../subflows/decline-ios-save-password.yaml

- assertVisible:
    id: 'signUpScreen'

# Sign up. Password kept to letters + digits to dodge any shift-key flakiness in Maestro's
# iOS input synthesis.
#
# iOS Simulator quirk: the very first tap on a TextInput after a screen mount often gets
# absorbed bringing up the keyboard rather than focusing the field, so the immediately-following
# inputText goes nowhere. We tap the email field TWICE so the second tap is the one that
# actually focuses — once the keyboard is up, subsequent fields focus on a single tap.
- tapOn:
    id: 'signUpEmailInput'
- tapOn:
    id: 'signUpEmailInput'
- inputText: ${output.email}
- tapOn:
    id: 'signUpPasswordInput'
- inputText: 'StrongPassword123'
- tapOn:
    id: 'submitSignUp'
- runFlow: ../subflows/decline-ios-save-password.yaml

# Signing up establishes a session and lands on the landlord's spot list
- assertVisible:
    id: 'parkingSpotsListScreen'
- assertVisible:
    id: 'addParkingSpotCard'

# Log out — back to the log-in screen, session cleared
- tapOn:
    id: 'logoutButton'
- assertVisible:
    id: 'logInScreen'

# Log back in with the same credentials the signup created
- tapOn:
    id: 'logInEmailInput'
- tapOn:
    id: 'logInEmailInput'
- inputText: ${output.email}
- tapOn:
    id: 'logInPasswordInput'
- inputText: 'StrongPassword123'
- tapOn:
    id: 'submitLogIn'
- runFlow: ../subflows/decline-ios-save-password.yaml

- assertVisible:
    id: 'parkingSpotsListScreen'
